name: Azure Preview Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify MarketOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Market data smoke
        run: pnpm smoke:market

      - name: Twelve Data adapter/cache smoke
        run: pnpm smoke:twelvedata

      - name: AI chart smoke
        run: pnpm smoke:ai-chart

      - name: Strategy Tester smoke
        run: pnpm smoke:backtest

      - name: Custom indicator formula smoke
        run: pnpm smoke:formula

      - name: Market events smoke
        run: pnpm smoke:events

      - name: Company Feed demo smoke
        run: pnpm smoke:feed

      - name: Company Feed provider security/cache smoke
        run: pnpm smoke:feed-provider

      - name: Web Push runtime/security smoke
        run: pnpm smoke:web-push

      - name: Prepare Azure API bundle
        run: pnpm prepare:azure-api

      - name: Azure packaging smoke
        run: pnpm smoke:azure

  deploy:
    name: Deploy Azure Static Web App
    needs: verify
    runs-on: ubuntu-latest
    environment: azure-preview
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deployment token
        shell: bash
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo "::error::Missing AZURE_STATIC_WEB_APPS_API_TOKEN in GitHub Actions secrets."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build MarketOS
        run: pnpm build

      - name: Prepare standalone Azure API
        run: pnpm prepare:azure-api

      - name: Install Azure API runtime dependencies
        run: npm install --omit=dev --ignore-scripts --prefix artifacts/azure-api

      - name: Deploy prebuilt web and API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "apps/web/dist"
          api_location: "artifacts/azure-api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

name: Hosted Production Boundary Acceptance

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "MarketOS production origin, for example https://example.azurestaticapps.net"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-production-boundary
  cancel-in-progress: false

jobs:
  acceptance:
    name: Hosted boundary acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MARKETOS_ACCEPTANCE_BASE_URL: ${{ inputs.base_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify hosted production boundary
        run: node scripts/hosted-boundary-acceptance.mjs

      - name: Upload non-secret acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-boundary-acceptance
          path: artifacts/hosted-boundary-acceptance.json
          retention-days: 14
          if-no-files-found: warn

name: Apply verified strict-client source patch

on:
  push:
    branches: [feature/production-client-history-20260920]
    paths: [.github/workflows/strict-client-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'i20sss20-maker/MarketOS' && github.ref == 'refs/heads/feature/production-client-history-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the exact reviewed source patch
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path('.github/patches')
          encoded = ''.join((root / f'strict-client.{i}.b64').read_text().strip() for i in (1, 2, 3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '8e5032f119cf65e3a0b2077e19a92c498a6b7305e6636cec02748302f393ba3b'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch; no source changes applied.')
          pathlib.Path('/tmp/strict-client.patch').write_bytes(patch)
          print('Verified source patch:', len(patch), 'bytes')
      - name: Apply and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/strict-client.patch
          git apply /tmp/strict-client.patch
          git add -- .github/workflows/ci.yml .github/workflows/production-client-verify.yml \
            apps/web/src/App.tsx apps/web/src/components/AnalystForecastView.tsx \
            apps/web/src/components/CommercialAiPanel.tsx apps/web/src/components/CorrelationPanel.tsx \
            apps/web/src/components/HomeDashboard.tsx apps/web/src/components/ServerForecastHistory.tsx \
            apps/web/src/lib/aiApi.ts apps/web/src/lib/analystRadarCache.ts apps/web/src/lib/cloudState.ts \
            apps/web/src/lib/eventsApi.ts apps/web/src/lib/feedApi.ts apps/web/src/lib/forecastJournal.ts \
            apps/web/src/lib/marketApi.ts apps/web/src/lib/productionMode.ts apps/web/src/lib/serverForecastApi.ts \
            apps/web/src/styles.css docs/production-client.md package.json scripts/production-client-smoke.mjs
          git rm -- .github/patches/strict-client.1.b64 .github/patches/strict-client.2.b64 \
            .github/patches/strict-client.3.b64 .github/workflows/strict-client-apply.yml
          git diff --cached --check
          git config user.name 'MarketOS automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: enforce strict browser data and show authenticated server history'
          git push origin HEAD:refs/heads/feature/production-client-history-20260920

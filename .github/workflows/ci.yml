name: MarketOS CI

on:
  push:
    branches: ["main", "foundation/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Market data runtime smoke test
        run: pnpm smoke:market

      - name: Twelve Data adapter/cache smoke test
        run: pnpm smoke:twelvedata

      - name: AI chart context runtime smoke test
        run: pnpm smoke:ai-chart

      - name: Multi-Timeframe AI runtime smoke test
        run: pnpm smoke:multi-timeframe

      - name: Advanced Alerts runtime smoke test
        run: pnpm smoke:alerts

      - name: Strategy Tester runtime smoke test
        run: pnpm smoke:backtest

      - name: Custom indicator formula smoke test
        run: pnpm smoke:formula

      - name: Market events runtime smoke test
        run: pnpm smoke:events

      - name: Smart Screener runtime smoke test
        run: pnpm smoke:screener

      - name: Correlation Matrix runtime smoke test
        run: pnpm smoke:correlation

      - name: Instrument Overview stats smoke test
        run: pnpm smoke:instrument-stats

      - name: Company Feed demo runtime smoke test
        run: pnpm smoke:feed

      - name: Company Feed provider security/cache smoke test
        run: pnpm smoke:feed-provider

      - name: Cloud auth/state runtime smoke test
        run: pnpm smoke:cloud-state

      - name: Server alerts end-to-end smoke test
        run: pnpm smoke:server-alerts

      - name: Internal background alert sweep smoke test
        run: pnpm smoke:background-alerts

      - name: Alert worker pagination/security smoke test
        run: pnpm smoke:alert-worker

      - name: Prepare Azure API bundle
        run: pnpm prepare:azure-api

      - name: Prepare scheduled alert worker bundle
        run: pnpm prepare:alert-worker

      - name: Scheduled alert worker package smoke test
        run: pnpm smoke:alert-worker-package

      - name: Azure preview packaging smoke test
        run: pnpm smoke:azure

      - name: Parse Azure bootstrap PowerShell
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content "./infrastructure/azure/bootstrap-preview.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/bootstrap-cosmos.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/bootstrap-alert-worker.ps1" -Raw)) | Out-Null

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketos-web-preview
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

name: MarketOS CI

on:
  push:
    branches: ["main", "foundation/**", "feature/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: marketos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Production data and server journal runtime tests
        run: pnpm smoke:production-foundation

      - name: Strict provider endpoint authentication smoke test
        run: pnpm smoke:production-market-auth

      - name: Hosted production boundary workflow source smoke test
        run: pnpm smoke:hosted-boundary-source

      - name: Live provider acceptance source/freshness smoke test
        run: pnpm smoke:provider-live-acceptance-source

      - name: Market data timing and usage-rights provenance smoke test
        run: pnpm smoke:market-data-provenance

      - name: Azure monitoring and cost guardrails smoke test
        run: pnpm smoke:operations-guardrails

      - name: Hosted forecast evaluator rollout smoke test
        run: pnpm smoke:forecast-evaluator-rollout

      - name: Secure Azure deployment-token sync smoke test
        run: pnpm smoke:deployment-token-sync

      - name: Strict Azure production deployment workflow smoke test
        run: pnpm smoke:azure-production-deploy

      - name: Full account-data erasure smoke test
        run: pnpm smoke:account-data-erasure

      - name: Free-tier production storage bootstrap smoke test
        run: pnpm smoke:production-storage-bootstrap

      - name: Cosmos runtime no-provision smoke test
        run: pnpm smoke:cosmos-runtime-no-provision

      - name: Live Cosmos acceptance workflow source smoke test
        run: pnpm smoke:cosmos-live-acceptance-source

      - name: Live account erasure storage acceptance source smoke test
        run: pnpm smoke:live-account-erasure-storage-source

      - name: Live quota concurrency acceptance source smoke test
        run: pnpm smoke:live-quota-concurrency-source

      - name: Market-data request quota concurrency and ordering smoke test
        run: pnpm smoke:market-data-request-quota

      - name: Production readiness UI semantics smoke test
        run: pnpm smoke:production-readiness-ui

      - name: Hosted ingress load workflow source smoke test
        run: pnpm smoke:hosted-ingress-load-source

      - name: Forecast generation quota concurrency smoke test
        run: pnpm smoke:forecast-quota

      - name: Strict forecast usage and manual Radar smoke test
        run: pnpm smoke:strict-forecast-usage

      - name: Build
        run: pnpm build

      - name: Direct real-data forecast boundary smoke test
        run: pnpm smoke:direct-forecast-boundary

      - name: Strict browser data and server history tests
        run: pnpm smoke:production-client

      - name: Market data runtime smoke test
        run: pnpm smoke:market

      - name: Twelve Data adapter/cache smoke test
        run: pnpm smoke:twelvedata

      - name: AI chart context runtime smoke test
        run: pnpm smoke:ai-chart

      - name: Multi-Timeframe AI runtime smoke test
        run: pnpm smoke:multi-timeframe

      - name: Advanced Alerts runtime smoke test
        run: pnpm smoke:alerts

      - name: Strategy Tester runtime smoke test
        run: pnpm smoke:backtest

      - name: Custom indicator formula smoke test
        run: pnpm smoke:formula

      - name: Market events runtime smoke test
        run: pnpm smoke:events

      - name: Smart Screener runtime smoke test
        run: pnpm smoke:screener

      - name: Correlation Matrix runtime smoke test
        run: pnpm smoke:correlation

      - name: Instrument Overview stats smoke test
        run: pnpm smoke:instrument-stats

      - name: Company Feed demo runtime smoke test
        run: pnpm smoke:feed

      - name: Company Feed provider security/cache smoke test
        run: pnpm smoke:feed-provider

      - name: Cloud auth/state runtime smoke test
        run: pnpm smoke:cloud-state

      - name: Entitlements and plan limits smoke test
        run: pnpm smoke:entitlements

      - name: Server alerts end-to-end smoke test
        run: pnpm smoke:server-alerts

      - name: Alert inbox runtime smoke test
        run: pnpm smoke:alert-inbox

      - name: Web Push runtime/security smoke test
        run: pnpm smoke:web-push

      - name: Export and Share runtime smoke test
        run: pnpm smoke:export-share

      - name: Command Palette ranking smoke test
        run: pnpm smoke:command-palette

      - name: Home Dashboard model smoke test
        run: pnpm smoke:home-dashboard

      - name: Chart Templates source smoke test
        run: pnpm smoke:chart-templates

      - name: Multiple Watchlists migration smoke test
        run: pnpm smoke:multiple-watchlists

      - name: Pane Independence workspace smoke test
        run: pnpm smoke:pane-independence

      - name: Object Tree runtime smoke test
        run: pnpm smoke:object-tree

      - name: Replay V2 runtime smoke test
        run: pnpm smoke:replay-v2

      - name: Drawing Alerts bridge smoke test
        run: pnpm smoke:drawing-alerts

      - name: Pane Linking workspace smoke test
        run: pnpm smoke:pane-linking

      - name: Crosshair Linking runtime smoke test
        run: pnpm smoke:crosshair-linking

      - name: Chart Tabs session smoke test
        run: pnpm smoke:chart-tabs

      - name: Analyst Forecast engine smoke test
        run: pnpm smoke:analyst-forecast

      - name: Analyst historical calibration smoke test
        run: pnpm smoke:analyst-calibration

      - name: Forecast Journal scorecard smoke test
        run: pnpm smoke:forecast-journal

      - name: Analyst Radar ranking and integration smoke test
        run: pnpm smoke:analyst-radar

      - name: Shared Analyst Radar Scanner smoke test
        run: pnpm smoke:analyst-radar-scanner

      - name: Analyst Radar cache and auto-refresh smoke test
        run: pnpm smoke:analyst-radar-cache

      - name: Analyst Performance and forecast monitor smoke test
        run: pnpm smoke:analyst-performance

      - name: Shared Forecast Monitor policy smoke test
        run: pnpm smoke:forecast-monitor-policy

      - name: Analyst Brief home intelligence smoke test
        run: pnpm smoke:analyst-brief

      - name: Analyst Model Health smoke test
        run: pnpm smoke:analyst-model-health

      - name: Analyst Attention Queue smoke test
        run: pnpm smoke:analyst-attention

      - name: Structured Catalyst Impact smoke test
        run: pnpm smoke:analyst-catalyst-impact

      - name: Forecast Watch scenario alert smoke test
        run: pnpm smoke:forecast-watch

      - name: Internal background alert sweep smoke test
        run: pnpm smoke:background-alerts

      - name: Alert worker pagination/security smoke test
        run: pnpm smoke:alert-worker

      - name: Prepare Azure API bundle
        run: pnpm prepare:azure-api

      - name: Prepare scheduled alert worker bundle
        run: pnpm prepare:alert-worker

      - name: Scheduled alert worker package smoke test
        run: pnpm smoke:alert-worker-package

      - name: Azure preview packaging smoke test
        run: pnpm smoke:azure

      - name: Parse Azure bootstrap PowerShell
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content "./infrastructure/azure/bootstrap-preview.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/bootstrap-cosmos.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/bootstrap-alert-worker.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/bootstrap-web-push.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/bootstrap-production-storage.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/configure-market-data-policy.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/bootstrap-operations-guardrails.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/sync-deployment-token.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/verify-application-insights.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "./infrastructure/azure/configure-forecast-evaluation.ps1" -Raw)) | Out-Null

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketos-web-preview
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

name: MarketOS CI

on:
  push:
    branches: ["main", "foundation/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Market data runtime smoke test
        run: pnpm smoke:market

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketos-web-preview
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

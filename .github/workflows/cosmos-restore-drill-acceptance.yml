name: Cosmos Restore Drill Acceptance

on:
  workflow_dispatch:
    inputs:
      marker_id:
        description: "Marker ID from Cosmos Recovery Marker Seed evidence"
        required: true
        type: string
      source_endpoint_hash:
        description: "Source endpoint SHA-256 from marker evidence"
        required: true
        type: string
      confirmation:
        description: "Type VERIFY MARKETOS RESTORE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cosmos-restore-drill-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Verify separate restored Cosmos account
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'VERIFY MARKETOS RESTORE' }}
    runs-on: ubuntu-latest
    environment: azure-production
    timeout-minutes: 8
    env:
      COSMOS_RESTORE_CONNECTION_STRING: ${{ secrets.COSMOS_RESTORE_CONNECTION_STRING }}
      COSMOS_DATABASE: ${{ vars.COSMOS_DATABASE || 'marketos' }}
      COSMOS_CONTAINER: ${{ vars.COSMOS_CONTAINER || 'userState' }}
      COSMOS_ENTITLEMENTS_CONTAINER: ${{ vars.COSMOS_ENTITLEMENTS_CONTAINER || 'entitlements' }}
      FORECAST_JOURNAL_CONTAINER: ${{ vars.FORECAST_JOURNAL_CONTAINER || 'forecastJournal' }}
      MARKETOS_RECOVERY_DRILL_MODE: verify
      MARKETOS_RECOVERY_MARKER_ID: ${{ inputs.marker_id }}
      MARKETOS_RECOVERY_SOURCE_ENDPOINT_HASH: ${{ inputs.source_endpoint_hash }}

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require restored-account credential without printing it
        shell: bash
        run: |
          if [ -z "$COSMOS_RESTORE_CONNECTION_STRING" ]; then
            echo "::error::COSMOS_RESTORE_CONNECTION_STRING is missing from azure-production."
            echo "::error::Restore the backup to a separate account first; this workflow never creates a restore and never falls back to production."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify recovered marker read-only
        run: node scripts/cosmos-recovery-drill.mjs

      - name: Upload non-secret restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-restore-drill-acceptance
          path: artifacts/cosmos-restore-drill-acceptance.json
          retention-days: 90
          if-no-files-found: warn

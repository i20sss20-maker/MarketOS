name: Cosmos Live Storage Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-live-storage-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Live Cosmos persistence and isolation
    runs-on: ubuntu-latest
    environment: azure-production
    timeout-minutes: 8
    env:
      COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_CONNECTION_STRING }}
      COSMOS_DATABASE: ${{ vars.COSMOS_DATABASE || 'marketos' }}
      COSMOS_CONTAINER: ${{ vars.COSMOS_CONTAINER || 'userState' }}
      COSMOS_ENTITLEMENTS_CONTAINER: ${{ vars.COSMOS_ENTITLEMENTS_CONTAINER || 'entitlements' }}
      FORECAST_JOURNAL_CONTAINER: ${{ vars.FORECAST_JOURNAL_CONTAINER || 'forecastJournal' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require storage credential without printing it
        shell: bash
        run: |
          if [ -z "$COSMOS_CONNECTION_STRING" ]; then
            echo "::error::COSMOS_CONNECTION_STRING is missing from the azure-production environment."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify live Cosmos persistence, partition isolation and cleanup
        run: node scripts/cosmos-live-acceptance.mjs

      - name: Upload non-secret acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-live-acceptance
          path: artifacts/cosmos-live-acceptance.json
          retention-days: 14
          if-no-files-found: warn
